<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690" role="img" aria-labelledby="title desc"><title id="title">FM radio intended system architecture</title><desc id="desc">Antenna feeds Si4705 and headphone and speaker amplifiers. RP2040 controls the receiver and OLED on separate I2C signal pairs. USB-C supplies a protected 5 volt rail and regulated 3.3 volt rail.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#1a81bc"/></marker></defs><rect width="1100" height="690" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#243746"><text x="35" y="42" font-size="25" font-weight="bold">FM Radio — Intended System Architecture</text><text x="35" y="71" font-size="16">Functional relationships; Independent RF, audio, control, and power functions</text><rect x="35" y="110" width="250" height="105" rx="9" fill="#e5f2fb" stroke="#b0c6d8"/><text x="160.0" y="139" text-anchor="middle" font-size="18" font-weight="bold">External FM Antenna</text><text x="160.0" y="165" text-anchor="middle" font-size="16">88–108 MHz target</text><text x="160.0" y="188" text-anchor="middle" font-size="16">Nominal 75 Ω interface</text><rect x="390" y="110" width="275" height="105" rx="9" fill="#e5f2fb" stroke="#b0c6d8"/><text x="527.5" y="139" text-anchor="middle" font-size="18" font-weight="bold">Si4705 Receiver</text><text x="527.5" y="165" text-anchor="middle" font-size="16">FM tuning and demodulation</text><text x="527.5" y="188" text-anchor="middle" font-size="16">Analog left / right outputs</text><rect x="770" y="100" width="295" height="145" rx="9" fill="#fff1df" stroke="#b0c6d8"/><text x="917.5" y="129" text-anchor="middle" font-size="18" font-weight="bold">Audio Output Stages</text><text x="917.5" y="155" text-anchor="middle" font-size="16">TPA6111A2 → stereo jack</text><text x="917.5" y="178" text-anchor="middle" font-size="16">TPA2005D1 → 8 Ω speaker</text><text x="917.5" y="201" text-anchor="middle" font-size="16">Hardware speaker interlock</text><path d="M285 162 H390" fill="none" stroke="#1a81bc" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M665 162 H770" fill="none" stroke="#1a81bc" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="325" width="250" height="110" rx="9" fill="#e5f2fb" stroke="#b0c6d8"/><text x="160.0" y="354" text-anchor="middle" font-size="18" font-weight="bold">USB-C Connection</text><text x="160.0" y="380" text-anchor="middle" font-size="16">5 V input</text><text x="160.0" y="403" text-anchor="middle" font-size="16">USB data → RP2040</text><rect x="390" y="325" width="275" height="110" rx="9" fill="#e5f2fb" stroke="#b0c6d8"/><text x="527.5" y="354" text-anchor="middle" font-size="18" font-weight="bold">RP2040 Controller</text><text x="527.5" y="380" text-anchor="middle" font-size="16">External QSPI flash + clock</text><text x="527.5" y="403" text-anchor="middle" font-size="16">Receiver control and UI</text><rect x="770" y="325" width="295" height="110" rx="9" fill="#e5f2fb" stroke="#b0c6d8"/><text x="917.5" y="354" text-anchor="middle" font-size="18" font-weight="bold">Display and Controls</text><text x="917.5" y="380" text-anchor="middle" font-size="16">OLED: GPIO18 / GPIO19</text><text x="917.5" y="403" text-anchor="middle" font-size="16">Four GPIO pushbuttons</text><path d="M285 380 H390" fill="none" stroke="#1a81bc" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M665 380 H770" fill="none" stroke="#1a81bc" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M528 325 V215" fill="none" stroke="#1a81bc" stroke-width="2.5" marker-end="url(#arrow)"/><text x="542" y="265" font-size="15">Receiver I²C</text><text x="542" y="287" font-size="15">GPIO4 / GPIO5</text><text x="690" y="308" font-size="15">OLED I²C</text><text x="35" y="479" font-size="20" font-weight="bold">Power Distribution</text><rect x="35" y="505" width="250" height="100" rx="9" fill="#edf5ea" stroke="#b0c6d8"/><text x="160.0" y="534" text-anchor="middle" font-size="18" font-weight="bold">USB 5 V</text><text x="160.0" y="560" text-anchor="middle" font-size="16">TPS2553 current-limit switch</text><text x="160.0" y="583" text-anchor="middle" font-size="16">SYS_5V → audio amplifiers</text><rect x="390" y="505" width="275" height="100" rx="9" fill="#edf5ea" stroke="#b0c6d8"/><text x="527.5" y="534" text-anchor="middle" font-size="18" font-weight="bold">TLV75533 LDO</text><text x="527.5" y="560" text-anchor="middle" font-size="16">SYS_3V3 → RP2040 + OLED</text><text x="527.5" y="583" text-anchor="middle" font-size="16">3.3 V linear regulation</text><rect x="770" y="505" width="295" height="100" rx="9" fill="#edf5ea" stroke="#b0c6d8"/><text x="917.5" y="534" text-anchor="middle" font-size="18" font-weight="bold">Hold-up + RF Filtering</text><text x="917.5" y="560" text-anchor="middle" font-size="16">FM_3V3 → Si4705</text><text x="917.5" y="583" text-anchor="middle" font-size="16">LM66100, ferrite, capacitors</text><path d="M285 555 H390" fill="none" stroke="#1a81bc" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M665 555 H770" fill="none" stroke="#1a81bc" stroke-width="2.5" marker-end="url(#arrow)"/><text x="35" y="651" font-size="16">Separate I²C wiring shown; receiver uses I²C0 on GPIO4/5; OLED uses I²C1 on GPIO18/19.</text></g></svg>